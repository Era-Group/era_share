<!-- Era law firm: an original halftone band in the house palette.

     The grid rhythm and the two colours are the house idiom. The modulation is
     periodic mathematics rather than a silhouette, so the band carries no
     figure to recognise, and every frequency is a whole number of cycles across
     the tile, so it repeats seamlessly at any width. -->
<defs>
<linearGradient id="eraFade" x1="0" y1="0" x2="0" y2="288" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff" stop-opacity="1"/>
<stop offset=".45" stop-color="#fff" stop-opacity=".62"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="eraFadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="288">
<rect width="720" height="288" fill="url(#eraFade)"/>
</mask>
</defs>
