<svg width="1440" height="180" viewBox="0 0 1440 180" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Era law firm: an original halftone band in the house palette.

     A regular grid where each dot's size and opacity vary — the generic
     technique — driven mostly by per-dot noise, so the field reads as texture
     and resolves into no figure. The two shaping waves run along the width
     only: a wave that also ran down the height drew diagonals, and diagonals
     in a dot field resolve into shapes the eye names.

     The colours run green, grey, gold, green from edge to edge, with the
     boundaries dithered so no line appears where one gives way to the next. -->
<defs>
<linearGradient id="eraFade" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff" stop-opacity="1"/>
<stop offset=".5" stop-color="#fff" stop-opacity=".5"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<mask id="eraFadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="180">
<rect width="1440" height="180" fill="url(#eraFade)"/>
</mask>
</defs>
