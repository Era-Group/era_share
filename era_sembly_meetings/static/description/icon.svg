<!--
    ERA Sembly.ai Meetings — module icon (editable source).

    Era icon family: 140x140, rounded square (r = 30 ≈ 21% of the side), one flat
    brand-family fill, a single white geometric glyph and exactly one accent element.
    Navy #304375 + accent #7FB2FF is the same colourway as era_crm_ai_agents_dead_lead
    and era_crm_ai_agents_lead_gen.

    The PNG beside this file is rendered from the SAME coordinate system (see the
    "Branding" section of README.md). Keep the two in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- brand plate -->
  <rect x="0" y="0" width="140" height="140" rx="30" fill="#304375"/>

  <!-- transcript card + tail -->
  <path d="M44 96 L44 113 L66 96 Z" fill="#FFFFFF"/>
  <rect x="28" y="34" width="84" height="62" rx="12" fill="#FFFFFF"/>

  <!-- transcript lines -->
  <rect x="40" y="50" width="60" height="8" rx="4" fill="#304375"/>
  <rect x="40" y="64" width="48" height="8" rx="4" fill="#304375"/>
  <rect x="40" y="78" width="34" height="8" rx="4" fill="#304375"/>

  <!-- accent: "recorded" badge -->
  <circle cx="102" cy="94" r="13" fill="#7FB2FF"/>
  <circle cx="102" cy="94" r="5" fill="#FFFFFF"/>
</svg>
