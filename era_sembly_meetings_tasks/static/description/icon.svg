<!--
    ERA Sembly.ai Meetings — Projects & Tasks — module icon (editable source).

    Sibling of era_sembly_meetings/static/description/icon.svg: same silhouette and
    the same 140-unit coordinate system, moss colourway (#3F7D3A + accent #B7E36B)
    so the four Sembly modules read as one family while staying distinguishable
    from the base navy (#304375), the CRM plum (#6B3FA0) and the ticket teal
    (#0D6E6E).

    Glyph: a task card whose top line carries a checkmark, so it reads as
    "task" rather than "transcript" at 32px.

    The PNG beside this file is rendered from the SAME coordinate system (see the
    "Branding" section of era_sembly_meetings/README.md). Keep the two in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- brand plate -->
  <rect x="0" y="0" width="140" height="140" rx="30" fill="#3F7D3A"/>

  <!-- task card + tail -->
  <path d="M44 96 L44 113 L66 96 Z" fill="#FFFFFF"/>
  <rect x="28" y="34" width="84" height="62" rx="12" fill="#FFFFFF"/>

  <!-- checkmark on the first line -->
  <path d="M40 54 L46 60 L58 47" fill="none" stroke="#3F7D3A" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="66" y="50" width="34" height="8" rx="4" fill="#3F7D3A"/>

  <!-- task lines -->
  <rect x="40" y="68" width="48" height="8" rx="4" fill="#3F7D3A"/>
  <rect x="40" y="82" width="34" height="8" rx="4" fill="#3F7D3A"/>

  <!-- accent: linked-meeting badge -->
  <circle cx="102" cy="94" r="13" fill="#B7E36B"/>
  <circle cx="102" cy="94" r="5" fill="#FFFFFF"/>
</svg>
