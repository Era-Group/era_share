repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [scss, javascript]

  - repo: local
    hooks:
      - id: xmllint
        name: xmllint
        language: system
        entry: xmllint --noout
        types: [xml]

      - id: check-ar-po
        name: Check ar.po is not stale
        language: script
        entry: scripts/check_ar_po.sh
        pass_filenames: false
