[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "F401",   # unused imports — Odoo __init__.py imports are side-effectful
    "UP007",  # use X | Y for unions — Odoo ORM doesn't use it
    "UP035",  # deprecated typing imports — keep compat
]

[tool.ruff.lint.isort]
known-third-party = ["odoo"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
